name: Upstream intake scan

# Weekly, read-only scan of upstream fixes that are not yet present on this
# fork. The workflow never cherry-picks, commits, pushes, or merges. It only
# opens or comments on an Issue so the fixes can be reviewed and imported
# manually on a dedicated branch.

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-intake
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan upstream fixes
        id: scan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set +e
          node scripts/upstream-intake.mjs --markdown > "${RUNNER_TEMP}/upstream-intake.md"
          status=$?
          set -e

          if [ "${status}" = "3" ]; then
            echo "No upstream fixes to report."
            exit 0
          fi

          if [ "${status}" != "0" ]; then
            cat "${RUNNER_TEMP}/upstream-intake.md"
            exit "${status}"
          fi

          {
            echo ""
            echo "---"
            echo ""
            echo "Generated by \`.github/workflows/upstream-intake.yml\`. Nothing was cherry-picked or merged."
            echo ""
            echo "Import one logical fix per branch, then verify before merging:"
            echo ""
            echo '```sh'
            echo "bun run upstream:import -- --sha <sha> --name <short-name>"
            echo '```'
            echo ""
            echo "See [\`docs/upstream-intake.md\`](../blob/main/docs/upstream-intake.md) and [\`UPSTREAM_IMPORTS.md\`](../blob/main/UPSTREAM_IMPORTS.md)."
          } >> "${RUNNER_TEMP}/upstream-intake.md"

          existing="$(gh issue list --state open --search 'Upstream intake in:title' --json number --jq '.[0].number // empty')"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body-file "${RUNNER_TEMP}/upstream-intake.md"
          else
            gh issue create \
              --title "Upstream intake $(date -u +%Y-%m-%d)" \
              --body-file "${RUNNER_TEMP}/upstream-intake.md"
          fi
